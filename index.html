<title>Дашборд ГП НТР — Вход</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Bebas+Neue:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Open Sans',sans-serif;background:#F3F6FB;color:#2F2F2F;min-height:100vh;display:flex;align-items:center;justify-content:center}
.lw{background:#fff;border-radius:12px;padding:40px;max-width:400px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,0.1);text-align:center}
.li{width:56px;height:56px;background:#2E69C2;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.li svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lt{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;margin-bottom:6px}
.ls{font-size:12px;color:#737373;margin-bottom:24px;line-height:1.5}
.inp{width:100%;padding:12px 16px;border:1.5px solid #E4E4E4;border-radius:8px;font-size:14px;font-family:'Open Sans',sans-serif;outline:none;transition:.15s}
.inp:focus{border-color:#2E69C2;box-shadow:0 0 0 3px rgba(46,105,194,.15)}
.btn{width:100%;padding:12px;background:#2E69C2;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:'Open Sans',sans-serif;cursor:pointer;margin-top:12px;transition:.15s}
.btn:hover{background:#295FAF}
.btn:disabled{background:#A3A3A3;cursor:not-allowed}
.err{font-size:11px;color:#FF6868;margin-top:10px;display:none}
.ldg{display:none;margin-top:12px;font-size:12px;color:#737373}
.ft{font-size:10px;color:#A3A3A3;margin-top:24px}
</style>
</head>
